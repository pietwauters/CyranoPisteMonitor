<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Fencing Score Display</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/style-v2.css">
</head>

<body>
  <button id="fullscreen-btn">Fullscreen</button>
  <select id="piste-select">
    <option value="">Select Piste</option>
  </select>
  <!-- Piezo buzzer sound (440Hz sine wave, 2s, generated by JS) -->
  <audio id="buzzer-sound" preload="auto"></audio>
  <div class="scoring-container">
    <div class="name-container v1-board">
      <div class="lName smName"></div>
      <div class="rName smName"></div>
    </div>

    <div class="top-row v1-board">
      <div class="left-lights">
        <div class="lColor smLamp smRed"></div>
        <div class="lWhite smLamp smWhite"></div>
      </div>
      <h4 class="poolNum">Strip Podium</h4>
      <div class="right-lights">
        <div class="rWhite smLamp smWhite"></div>
        <div class="rColor smLamp smGreen"></div>
      </div>
    </div>

    <div id="strip_Podium" class="scoringMachine v1-board">
      <div class="scoring-inner">
        <div class="flag-container">
          <img class="national-flag left-flag" alt="Left flag">
          <img class="national-flag right-flag" alt="Right flag">
        </div>

        <div class="fencer-photos">
          <div class="fencer-photo left-photo">
            <img alt="Left fencer">
          </div>
          <div class="fencer-photo right-photo">
            <img alt="Right fencer">
          </div>
        </div>

        <div class="timer-container">
          <div class="clock smClock">0:00</div>
          <div class="period smPeriod">1</div>
          <div id="uw2f-timer" class="uw2f-timer" style="display:none"></div>
          <div class="left-priority"></div>
          <div class="right-priority"></div>
        </div>

        <div class="card-container">
          <div class="lPCard smCard smPCard">P</div>
          <div class="lRed smCard smRed"></div>
          <div class="lYellow smCard smYellow"></div>
          <div class="rYellow smCard smYellow"></div>
          <div class="rRed smCard smRed"></div>
          <div class="rPCard smCard smPCard">P</div>
        </div>

        <div class="score-container">
          <div class="lScore smScore">0</div>
          <div class="rScore smScore">0</div>
          <div class="apparatus-state">W</div>
        </div>
      </div>
    </div>

    <div class="v2-board" id="v2-board">
      <div class="band band--left" id="v2-leftBand">
        <div class="edge-pill"></div>
        <div class="light-arrow">
          <span class="arrow-body"></span>
          <span class="arrow-tip"></span>
        </div>
        <div class="band-content">
          <div class="fencer-name">
            <span class="priority-mark" id="v2-leftPriority" title="Priority">P</span><span class="surname"></span> <span class="firstname"></span>
          </div>
          <div class="fencer-info">
            <div class="nation">
              <span class="nation-code"></span>
              <img class="flag" alt="">
            </div>
            <div class="score">0</div>
            <div class="cards">
              <div class="card yellow-card" id="v2-leftYellow" title="Yellow card"></div>
              <div class="card red-card" id="v2-leftRed" title="Red card"></div>
              <div class="card p-card" id="v2-leftP" title="Passivity card" data-level="0"><span class="card-letter">P</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="band band--right" id="v2-rightBand">
        <div class="edge-pill"></div>
        <div class="light-arrow">
          <span class="arrow-body"></span>
          <span class="arrow-tip"></span>
        </div>
        <div class="band-content">
          <div class="fencer-name">
            <span class="surname"></span> <span class="firstname"></span><span class="priority-mark" id="v2-rightPriority" title="Priority">P</span>
          </div>
          <div class="fencer-info">
            <div class="cards">
              <div class="card p-card" id="v2-rightP" title="Passivity card" data-level="0"><span class="card-letter">P</span></div>
              <div class="card red-card" id="v2-rightRed" title="Red card"></div>
              <div class="card yellow-card" id="v2-rightYellow" title="Yellow card"></div>
            </div>
            <div class="score">0</div>
            <div class="nation">
              <img class="flag" alt="">
              <span class="nation-code"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-col footer-col--piste">
          <span class="cap">Piste</span>
          <span class="val" id="v2-piste-val"></span>
        </div>

        <div class="footer-col footer-col--mid">
          <span class="state-badge" id="v2-stateBadge" data-state="W">W</span>
          <span class="cap">Poule</span>
          <span class="val" id="v2-poule-val"></span>
          <span class="subline" id="v2-subline"></span>
        </div>

        <div class="footer-col footer-col--time">
          <span class="uw2f" id="v2-uw2f"></span>
          <span class="clock" id="v2-clock">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/mqttws31.min.js"></script>
  <script src="/js/opp2.js"></script>
  <script src="/main.js"></script>
</body>

</html>
